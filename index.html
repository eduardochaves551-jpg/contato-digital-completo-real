<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0812">
  <meta name="description" content="Cartão digital de Eduardo, Founder of Noctyra. Contato, chave Pix e acesso à Noctyra.">
  <title>Eduardo · Contato Digital</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09080d;
      --panel: rgba(17, 16, 23, .94);
      --purple: #8b45f6;
      --purple-bright: #a855f7;
      --lavender: #c4a3ff;
      --muted: #aaa7b7;
      --line: rgba(196, 163, 255, .20);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0; min-height: 100vh; padding: 28px 16px;
      display: flex; align-items: center; justify-content: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8f7fb;
      background:
        radial-gradient(ellipse at 50% 8%, rgba(92, 30, 180, .28), transparent 37%),
        radial-gradient(ellipse at 50% 100%, rgba(75, 22, 148, .23), transparent 35%),
        linear-gradient(145deg, #09080d, #100d18 55%, #08070b);
    }
    .card {
      width: min(100%, 520px); padding: 34px 24px 26px;
      border: 1px solid rgba(190, 170, 220, .22); border-radius: 30px;
      background: linear-gradient(145deg, rgba(22, 20, 29, .97), rgba(12, 11, 16, .98));
      box-shadow: 0 24px 90px rgba(0, 0, 0, .42), 0 0 55px rgba(115, 49, 209, .08);
    }
    .profile { text-align: center; }
    .mark {
      width: 88px; height: 88px; margin: 0 auto 22px; border-radius: 28px;
      display: grid; place-items: center; font-size: 34px; font-weight: 800;
      color: #dfcaff; border: 1px solid #9560ec;
      background: radial-gradient(circle at 50% 0%, #30204d, #171020 72%);
      box-shadow: 0 0 30px rgba(139, 69, 246, .16), inset 0 0 20px rgba(139, 69, 246, .08);
    }
    .eyebrow { margin: 0 0 12px; color: var(--lavender); font-size: 12px; font-weight: 800; letter-spacing: .22em; }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 38px); letter-spacing: -.04em; line-height: 1.12; }
    .role { margin: 12px 0 0; color: #b7b3c2; font-size: 17px; }
    .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); margin: 30px 0 24px; }
    .actions { display: grid; gap: 12px; }
    .btn {
      min-height: 62px; width: 100%; padding: 15px 17px; border-radius: 19px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      color: #faf8ff; text-decoration: none; font: inherit; font-weight: 750; font-size: 15px;
      border: 1px solid rgba(177, 126, 255, .7); background: #20192d; cursor: pointer;
      transition: transform .15s ease, filter .15s ease, border-color .15s ease;
    }
    .btn:focus-visible { outline: 3px solid #d9bfff; outline-offset: 3px; }
    .btn:hover { filter: brightness(1.12); border-color: #c6a3ff; }
    .btn:active { transform: scale(.99); }
    .btn-primary {
      background: linear-gradient(105deg, #8746e9, #5d2bb8);
      border-color: #9b69f5; box-shadow: 0 7px 25px rgba(105, 45, 206, .18);
    }
    .btn-icon { width: 22px; height: 22px; flex: 0 0 22px; }
    .chevron { margin-left: auto; color: #c5a2ff; font-size: 24px; font-weight: 400; }
    .pix {
      margin-top: 24px; padding: 20px 18px 18px; border: 1px solid rgba(173, 163, 194, .20);
      border-radius: 23px; background: rgba(7, 7, 11, .45);
    }
    .pix-head { display: flex; align-items: center; gap: 13px; }
    .pix-icon { color: #a56cff; width: 28px; height: 28px; flex: 0 0 28px; }
    .pix h2 { font-size: 17px; margin: 0 0 7px; }
    .pix-key { color: #c0bdca; font-size: 14px; overflow-wrap: anywhere; }
    .copy-btn { margin-top: 16px; min-height: 52px; background: #19181f; border-color: rgba(173, 163, 194, .16); font-size: 14px; }
    .copy-btn svg { width: 19px; height: 19px; }
    .site-link {
      margin-top: 18px; padding: 18px 17px; min-height: 82px; justify-content: flex-start;
      text-align: left; background: linear-gradient(110deg, rgba(38, 24, 58, .8), rgba(17, 15, 24, .95));
      border-color: #8d4be5;
    }
    .site-link .site-copy { flex: 1; min-width: 0; }
    .site-title { display: block; font-size: 16px; margin-bottom: 5px; }
    .site-subtitle { display: block; color: #c0bacf; font-size: 12px; line-height: 1.45; font-weight: 450; }
    .site-url { display: block; margin-top: 5px; color: #bd91ff; font-size: 12px; font-weight: 650; }
    footer { text-align: center; color: #858091; margin-top: 27px; font-size: 12px; }
    footer strong { color: #b78aff; font-weight: 700; }
    .toast {
      position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px);
      padding: 12px 18px; border: 1px solid #8051c6; border-radius: 14px;
      color: #fff; background: #21172e; box-shadow: 0 10px 35px #0008;
      opacity: 0; pointer-events: none; transition: .2s ease; font-size: 14px; z-index: 5;
      width: max-content; max-width: calc(100vw - 32px); text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (min-width: 600px) { body { padding: 40px 20px; } .card { padding: 42px 30px 30px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="card" aria-label="Cartão digital de Eduardo">
    <header class="profile">
      <div class="mark" aria-label="Noctyra">N.</div>
      <p class="eyebrow">CONTATO DIGITAL</p>
      <h1>Eduardo</h1>
      <p class="role">Founder of Noctyra</p>
    </header>

    <div class="divider"></div>

    <section class="actions" aria-label="Opções de contato">
      <!-- Substitua 55DDDNUMERO pelo número completo com código do país e DDD, somente números. -->
      <a class="btn btn-primary" id="whatsappLink" href="#" target="_blank" rel="noopener noreferrer">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.2 11.8a8.2 8.2 0 0 1-12.1 7.1L3 20l1.2-4.8a8.2 8.2 0 1 1 16-3.4Z"/><path d="M8.5 8.1c.3-.6.6-.6.9-.6h.4c.2 0 .4.1.5.4l.7 1.7c.1.2.1.4-.1.6l-.6.7c-.2.2-.2.4 0 .6.5.9 1.2 1.5 2.1 1.9.2.1.4.1.6-.1l.8-.9c.2-.2.4-.2.6-.1l1.6.8c.3.1.4.3.4.5 0 .3-.2 1.2-.8 1.6-.5.4-1.2.6-2 .4-1.1-.3-2.4-.9-3.7-2.1-1.1-1-1.8-2.3-2-3.2-.2-.8.1-1.6.6-2.2Z"/></svg>
        Falar pelo WhatsApp <span class="chevron" aria-hidden="true">›</span>
      </a>
      <button class="btn" id="saveContact" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M19 8v8M15 12h8"/></svg>
        Salvar contato <span class="chevron" aria-hidden="true">›</span>
      </button>
    </section>

    <section class="pix" aria-labelledby="pixTitle">
      <div class="pix-head">
        <svg class="pix-icon" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M11.2 2.5a4.3 4.3 0 0 1 6.1 0l2.2 2.2-3.7 3.7a5.4 5.4 0 0 1-7.6 0L4.5 4.7l2.2-2.2a3.2 3.2 0 0 1 4.5 0ZM2.5 11.2l2.2-2.2 3.7 3.7a5.4 5.4 0 0 1 0 7.6l-3.7 3.7-2.2-2.2a4.3 4.3 0 0 1 0-6.1v-4.5Zm27 0v4.5a4.3 4.3 0 0 1 0 6.1l-2.2 2.2-3.7-3.7a5.4 5.4 0 0 1 0-7.6l3.7-3.7 2.2 2.2ZM11.2 29.5 9 27.3l3.7-3.7a5.4 5.4 0 0 1 7.6 0l3.7 3.7-2.2 2.2a4.3 4.3 0 0 1-6.1 0h-4.5Z" transform="translate(1 0)"/></svg>
        <div>
          <h2 id="pixTitle">Minha chave Pix</h2>
          <div class="pix-key" id="pixKey">eduardochaves551@gmail.com</div>
        </div>
      </div>
      <button class="btn copy-btn" id="copyPix" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h3"/></svg>
        Copiar chave Pix
      </button>
    </section>

    <a class="btn site-link" href="https://noctyra.app" target="_blank" rel="noopener noreferrer">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/></svg>
      <span class="site-copy">
        <span class="site-title">Conheça a Noctyra</span>
        <span class="site-subtitle">Inteligência comercial e prospecção.</span>
        <span class="site-url">noctyra.app</span>
      </span>
      <span class="chevron" aria-hidden="true">›</span>
    </a>

    <footer>Conecte-se com <strong>Eduardo · Noctyra</strong></footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    /*
      CONFIGURAÇÃO:
      1) Troque o valor abaixo pelo número de WhatsApp com código do país e DDD,
         somente números (ex.: 5511999999999). Não inclua +, espaços ou traços.
      2) O número não foi fornecido nesta conversa, então o botão ficará desativado
         até você configurar um número real.
    */
    const WHATSAPP_NUMBER = "";
    const PIX_KEY = "eduardochaves551@gmail.com";

    const whatsappLink = document.getElementById("whatsappLink");
    if (/^\d{10,15}$/.test(WHATSAPP_NUMBER)) {
      whatsappLink.href = "https://wa.me/" + WHATSAPP_NUMBER;
    } else {
      whatsappLink.href = "https://noctyra.app";
      whatsappLink.addEventListener("click", function (event) {
        event.preventDefault();
        showToast("Adicione seu número de WhatsApp no código para ativar este botão.");
      });
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2600);
    }

    document.getElementById("copyPix").addEventListener("click", async function () {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(PIX_KEY);
        } else {
          const input = document.createElement("textarea");
          input.value = PIX_KEY;
          input.style.position = "fixed";
          input.style.opacity = "0";
          document.body.appendChild(input);
          input.select();
          const copied = document.execCommand("copy");
          input.remove();
          if (!copied) throw new Error("copy failed");
        }
        showToast("Chave Pix copiada!");
      } catch (error) {
        showToast("Não foi possível copiar. Selecione e copie a chave manualmente.");
      }
    });

    document.getElementById("saveContact").addEventListener("click", function () {
      const phone = /^\d{10,15}$/.test(WHATSAPP_NUMBER) ? "+" + WHATSAPP_NUMBER : "";
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "FN:Eduardo",
        "N:;Eduardo;;;",
        "ORG:Noctyra",
        "TITLE:Founder of Noctyra",
        "EMAIL;TYPE=INTERNET:eduardochaves551@gmail.com",
        "URL:https://noctyra.app",
        phone ? "TEL;TYPE=CELL:" + phone : "",
        "END:VCARD"
      ].filter(Boolean).join("\r\n");
      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "Eduardo-Noctyra.vcf";
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1500);
      showToast("Contato pronto para salvar na agenda.");
    });
  </script>
</body>
</html>
